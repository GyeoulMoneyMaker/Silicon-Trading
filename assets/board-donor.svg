<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Donor board component placeholder">
  <defs>
    <linearGradient id="dpcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3326"/>
      <stop offset="1" stop-color="#1f1a12"/>
    </linearGradient>
    <linearGradient id="dchip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343b47"/>
      <stop offset="1" stop-color="#1a1f28"/>
    </linearGradient>
    <filter id="dsh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b0803" flood-opacity=".5"/>
    </filter>
  </defs>
  <g filter="url(#dsh)">
    <rect x="160" y="70" width="480" height="460" rx="16" fill="url(#dpcb)" stroke="#6b5636" stroke-width="2"/>
  </g>
  <g stroke="#8a6f45" stroke-width="2" fill="none" opacity=".5">
    <path d="M195 120h80v50h90M195 165h50v80h90M540 120h60v70h-60M540 400h-80v50h-70M195 450h100v-60M300 90v70h80"/>
  </g>
  <!-- missing component footprints -->
  <g>
    <rect x="286" y="196" width="170" height="170" rx="8" fill="#0c0906" stroke="#6b5636" stroke-dasharray="7 6"/>
    <text x="371" y="288" fill="#8a6f45" font-family="ui-monospace, Consolas, monospace" font-size="12" text-anchor="middle" letter-spacing="2">REMOVED</text>
    <g fill="#a58552" opacity=".8">
      <rect x="280" y="206" width="6" height="8"/><rect x="280" y="226" width="6" height="8"/>
      <rect x="280" y="246" width="6" height="8"/><rect x="280" y="266" width="6" height="8"/>
      <rect x="280" y="286" width="6" height="8"/><rect x="280" y="306" width="6" height="8"/>
      <rect x="280" y="326" width="6" height="8"/><rect x="280" y="346" width="6" height="8"/>
      <rect x="456" y="206" width="6" height="8"/><rect x="456" y="226" width="6" height="8"/>
      <rect x="456" y="246" width="6" height="8"/><rect x="456" y="266" width="6" height="8"/>
      <rect x="456" y="286" width="6" height="8"/><rect x="456" y="306" width="6" height="8"/>
      <rect x="456" y="326" width="6" height="8"/><rect x="456" y="346" width="6" height="8"/>
    </g>
  </g>
  <rect x="200" y="290" width="58" height="48" rx="4" fill="url(#dchip)" stroke="#4c5668"/>
  <rect x="500" y="270" width="66" height="52" rx="4" fill="url(#dchip)" stroke="#4c5668"/>
  <g fill="#b8935f" opacity=".75">
    <rect x="280" y="420" width="18" height="9" rx="2"/><rect x="306" y="420" width="18" height="9" rx="2"/>
    <rect x="332" y="420" width="18" height="9" rx="2"/><rect x="358" y="420" width="18" height="9" rx="2"/>
  </g>
  <!-- cracked / chipped corner -->
  <path d="M640 70l-42 42 28 6-22 30" fill="none" stroke="#0a0704" stroke-width="5" opacity=".55" stroke-linecap="round"/>
  <!-- mounting holes -->
  <g fill="#0b0803" stroke="#7a6240" stroke-width="3">
    <circle cx="196" cy="106" r="9"/><circle cx="604" cy="106" r="9"/>
    <circle cx="196" cy="494" r="9"/><circle cx="604" cy="494" r="9"/>
  </g>
  <g fill="#a58552" font-family="ui-monospace, Consolas, monospace" font-size="9" opacity=".8">
