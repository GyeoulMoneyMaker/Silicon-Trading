  <g fill="#b8935f" opacity=".9">
    <rect x="274" y="418" width="18" height="9" rx="2"/><rect x="300" y="418" width="18" height="9" rx="2"/>
    <rect x="326" y="418" width="18" height="9" rx="2"/><rect x="352" y="418" width="18" height="9" rx="2"/>
    <rect x="274" y="436" width="9" height="16" rx="2"/><rect x="295" y="436" width="9" height="16" rx="2"/>
    <rect x="316" y="436" width="9" height="16" rx="2"/><rect x="337" y="436" width="9" height="16" rx="2"/>
  </g>
  <!-- connectors -->
  <rect x="330" y="510" width="120" height="16" rx="4" fill="#16202f" stroke="#3d4a61"/>
  <g fill="#c87941"><rect x="342" y="514" width="5" height="8"/><rect x="356" y="514" width="5" height="8"/><rect x="370" y="514" width="5" height="8"/><rect x="384" y="514" width="5" height="8"/><rect x="398" y="514" width="5" height="8"/><rect x="412" y="514" width="5" height="8"/><rect x="426" y="514" width="5" height="8"/></g>
