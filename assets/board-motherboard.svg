  <g fill="#04100e" stroke="#2c7d6c" stroke-width="3">
    <circle cx="186" cy="96" r="10"/><circle cx="614" cy="96" r="10"/>
    <circle cx="186" cy="504" r="10"/><circle cx="614" cy="504" r="10"/>
  </g>
  <!-- silkscreen labels -->
  <g fill="#5fa596" font-family="ui-monospace, Consolas, monospace" font-size="9" opacity=".8">
    <text x="200" y="278">PMIC</text>
    <text x="492" y="278">NAND</text>
    <text x="492" y="372">WIFI</text>
    <text x="200" y="472">U2</text>
  </g>
